apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: library
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::072718160501:role/digital-library-dev-catalog"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: library
data:
  APP_ENV: aws
  AWS_REGION: "us-east-1"
  AWS_EC2_METADATA_DISABLED: "true"
  BOOKS_TABLE: "digital-library-dev-Books"
  COPIES_TABLE: "digital-library-dev-Copies"
  COVERS_BUCKET: "globally-unique-library-covers-bucket"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: library
spec:
  # The HPA owns replicas; GitOps must not reset its scale decisions
  # new comment.
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8002"
    spec:
      serviceAccountName: catalog
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog
          image: "072718160501.dkr.ecr.us-east-1.amazonaws.com/digital-library-dev/catalog@sha256:949209c6eab8fc92e27af38ca81b97aa63e4422719f541cde53c08694b895f4a"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: catalog-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: library
spec:
  type: ClusterIP
  selector:
    app: catalog
  ports:
    - name: http
      port: 80
      targetPort: http
